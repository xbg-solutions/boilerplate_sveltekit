name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22.12'
          cache: npm

      - name: Install (strict peer resolution)
        run: npm ci

      - name: Typecheck
        run: npm run check

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      # Lint runs against a documented baseline: the high-volume pre-existing
      # findings are warnings, not errors, so this gate catches NEW breakage
      # instead of being permanently red. See eslint.config.js for the
      # burn-down list.
      - name: Lint
        run: npm run lint

      - name: Audit
        run: npm audit --audit-level=high
